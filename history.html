<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Storico - FitCoach</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <header>
            <button onclick="showPage('dashboard')" class="back-btn">← Indietro</button>
            <h1>📚 Storico Allenamenti</h1>
        </header>

        <div id="history-list" class="history-list">
            <!-- Generato dinamicamente -->
        </div>

        <div id="no-history" class="empty-state" style="display:none;">
            <p>Nessun allenamento registrato</p>
            <button onclick="showPage('workout')" class="btn-primary">Inizia il primo workout!</button>
        </div>
    </div>

    <script src="js/avatars.js"></script>
    <script src="js/workout-engine.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
